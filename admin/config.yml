# The repository and optional OAuth URL are inserted into the rendered copy by GitHub Actions.
backend:
  name: github
  repo: Jun0zo/beyond-representation-source
  branch: main
  auth_methods: [token]
  # __OAUTH_CONFIG__

app_title: Beyond Representation · 글 관리

publish_mode: simple

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: journal
    label: Research Journal
    label_singular: 연구 기록
    folder: posts/journal
    path: '{{slug}}/index'
    extension: qmd
    format: yaml-frontmatter
    media_folder: ''
    public_folder: ''
    create: true
    fields:
      - &title { label: 제목, name: title, widget: string }
      - &draft { label: 비공개 초안, name: draft, widget: boolean, default: true, required: false, hint: '켜면 비공개로 저장됩니다. 끄고 저장하면 공개되며, 공개된 글은 저장할 때마다 블로그에 반영됩니다.' }
      - &body { label: 본문, name: body, widget: richtext }
      - &subtitle { label: 부제, name: subtitle, widget: string, required: false }
      - &description { label: 짧은 소개, name: description, widget: text, required: false, hint: '목록에 보여 줄 한두 문장' }
      - &date { label: 날짜, name: date, widget: datetime, type: date, default: '{{now}}', hint: '처음 쓴 날짜가 자동으로 입력됩니다. 발행할 때 원하는 날짜로 바꿀 수 있어요.' }
      - { label: 태그, name: categories, widget: list, default: ['Research Journal'], hint: '첫 번째 태그가 홈페이지 글 목록에 표시됩니다.' }
      - &image { label: 표지 이미지, name: image, widget: image, required: false }
      - &image-alt { label: 이미지 설명, name: image-alt, widget: string, required: false, hint: '이미지를 볼 수 없는 독자를 위한 짧은 설명' }
      - &featured { label: 홈페이지 추천 글, name: featured, widget: boolean, default: false, required: false }
      - &show-categories { name: title-block-categories, widget: hidden, default: true }
  - name: neuroscience
    label: Neuroscience × AI
    label_singular: 뇌과학과 AI
    folder: posts/neuroscience
    path: '{{slug}}/index'
    extension: qmd
    format: yaml-frontmatter
    media_folder: ''
    public_folder: ''
    create: true
    fields:
      - *title
      - *draft
      - *body
      - *subtitle
      - *description
      - *date
      - { label: 태그, name: categories, widget: list, default: ['Neuroscience × AI'], hint: '첫 번째 태그가 홈페이지 글 목록에 표시됩니다.' }
      - *image
      - *image-alt
      - *featured
      - *show-categories
  - name: papers
    label: Papers
    label_singular: 논문
    folder: posts/papers
    path: '{{slug}}/index'
    extension: qmd
    format: yaml-frontmatter
    media_folder: ''
    public_folder: ''
    create: true
    fields:
      - *title
      - *draft
      - *body
      - *subtitle
      - *description
      - *date
      - { label: 태그, name: categories, widget: list, default: ['Papers'], hint: '첫 번째 태그가 홈페이지 글 목록에 표시됩니다.' }
      - *image
      - *image-alt
      - *featured
      - *show-categories
  - name: agent
    label: Research Agent
    label_singular: 연구 에이전트
    folder: posts/agent
    path: '{{slug}}/index'
    extension: qmd
    format: yaml-frontmatter
    media_folder: ''
    public_folder: ''
    create: true
    fields:
      - *title
      - *draft
      - *body
      - *subtitle
      - *description
      - *date
      - { label: 태그, name: categories, widget: list, default: ['Research Agent'], hint: '첫 번째 태그가 홈페이지 글 목록에 표시됩니다.' }
      - *image
      - *image-alt
      - *featured
      - *show-categories
